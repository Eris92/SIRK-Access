name: Build and security checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build, test and publish
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PUBLISH_DIR: ${{ runner.temp }}/sirk-publish
      INTEGRATION_PROJECT: tests/Sirk.Access.Integration/Sirk.Access.Integration.csproj
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore and fail on vulnerable dependencies
        shell: pwsh
        run: |
          dotnet --version
          if (Test-Path 'packages.lock.json') {
            dotnet restore $env:INTEGRATION_PROJECT --locked-mode
          } else {
            dotnet restore $env:INTEGRATION_PROJECT --use-lock-file
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: dotnet build $env:INTEGRATION_PROJECT -c Release --no-restore
      - run: dotnet run --project $env:INTEGRATION_PROJECT -c Release --no-build --no-restore
      - run: dotnet publish Sirk.Access.csproj -c Release --no-build --no-restore -o $env:PUBLISH_DIR
      - run: node --check wwwroot/portal.js
      - run: python tests/check_schema.py
      - run: python tests/smoke_http.py $env:PUBLISH_DIR
      - run: python tests/check_publish.py $env:PUBLISH_DIR
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sirk-access-ci
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-lockfiles
          path: |
            packages.lock.json
            tests/Sirk.Access.Integration/packages.lock.json
          if-no-files-found: error
          retention-days: 7
